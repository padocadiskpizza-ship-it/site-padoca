<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clientes - Padoca</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;0,9..144,900;1,9..144,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#15100d; --panel:#1e1712; --panel-2:#251c16; --border:#37291f;
  --cream:#f7ecdc; --text:#f4ece0; --text-muted:#a99b8a;
  --tomato:#d3491f; --gold:#e2a53e; --green:#20895f; --red:#b3261e;
  --radius-lg:20px; --radius-md:14px; --radius-sm:10px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100vh;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Manrope',sans-serif;-webkit-font-smoothing:antialiased;}
h1,h2,h3{font-family:'Fraunces',serif;}
.hidden{display:none !important;}
body{display:flex;}

/* LOGIN */
.login-screen{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:2000;padding:24px;}
.login-mark{font-size:14px;letter-spacing:.14em;color:var(--gold);font-weight:700;text-transform:uppercase;margin-bottom:8px;}
.login-title{font-size:26px;font-weight:700;color:var(--cream);margin:0 0 22px;}
input[type="password"],input[type="text"]{
  padding:14px 16px;font-size:16px;border-radius:var(--radius-sm);
  border:1px solid var(--border);background:#120d0a;color:var(--text);box-sizing:border-box;outline:none;
}
input[type="password"]{width:270px;text-align:center;margin-bottom:14px;}
.btn{border:none;border-radius:var(--radius-sm);font-family:inherit;font-weight:700;cursor:pointer;transition:transform .08s;}
.btn:active{transform:scale(.97);}
.btn-login{padding:14px 34px;background:linear-gradient(155deg,var(--gold),#c98a2a);color:#241a10;font-size:15.5px;}

/* LAYOUT */
#cadastro-layout-principal{display:flex;width:100%;height:100%;}
.sidebar{width:34%;max-width:360px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:24px;box-sizing:border-box;}
.main-content{flex:1;background:var(--bg);padding:34px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:flex-start;overflow-y:auto;}

.sidebar-mark{font-size:12.5px;letter-spacing:.14em;color:var(--gold);font-weight:700;text-transform:uppercase;margin-bottom:6px;}
.sidebar h2{color:var(--cream);margin:0 0 16px;font-size:21px;}
.search-box{width:100%;padding:12px 14px;font-size:14.5px;margin-bottom:18px;}
.lista-usuarios{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;}
.empty-list{color:var(--text-muted);font-size:14px;padding:10px 2px;}

.usuario-item{background:var(--panel-2);border:1px solid var(--border);padding:11px 12px 11px 14px;border-radius:var(--radius-sm);cursor:pointer;color:var(--text);transition:border-color .15s;display:flex;align-items:center;gap:10px;}
.usuario-item:hover{border-color:var(--gold);}
.usuario-item.active{background:linear-gradient(155deg,var(--gold),#c98a2a);color:#241a10;border-color:var(--gold);}
/* Níveis por quantidade de pizzas: 10 verde, 20 vermelho, 30 azul, 40 amarelo, 50 roxo */
.usuario-item.tier-10{border-color:#20895f;}
.usuario-item.tier-10 .u-meta{color:#4fd39a;font-weight:700;}
.usuario-item.tier-10 .btn-hist{color:#4fd39a;border-color:#20895f;}
.usuario-item.tier-10.active{background:linear-gradient(155deg,#20895f,#166a49);color:#fff;border-color:#20895f;}
.usuario-item.tier-10.active .u-meta{color:#dffff0;}
.usuario-item.tier-10.active .btn-hist{color:#fff;border-color:#fff;}

.usuario-item.tier-20{border-color:#e0413b;}
.usuario-item.tier-20 .u-meta{color:#f28b86;font-weight:700;}
.usuario-item.tier-20 .btn-hist{color:#f28b86;border-color:#e0413b;}
.usuario-item.tier-20.active{background:linear-gradient(155deg,#e0413b,#a92323);color:#fff;border-color:#e0413b;}
.usuario-item.tier-20.active .u-meta{color:#ffe3e1;}
.usuario-item.tier-20.active .btn-hist{color:#fff;border-color:#fff;}

.usuario-item.tier-30{border-color:#3b82f6;}
.usuario-item.tier-30 .u-meta{color:#8fb8ff;font-weight:700;}
.usuario-item.tier-30 .btn-hist{color:#8fb8ff;border-color:#3b82f6;}
.usuario-item.tier-30.active{background:linear-gradient(155deg,#3b82f6,#1d4ed8);color:#fff;border-color:#3b82f6;}
.usuario-item.tier-30.active .u-meta{color:#e2ecff;}
.usuario-item.tier-30.active .btn-hist{color:#fff;border-color:#fff;}

.usuario-item.tier-40{border-color:#f2c94c;}
.usuario-item.tier-40 .u-meta{color:#f2c94c;font-weight:700;}
.usuario-item.tier-40 .btn-hist{color:#f2c94c;border-color:#f2c94c;}
.usuario-item.tier-40.active{background:linear-gradient(155deg,#f2c94c,#c79a1f);color:#241a10;border-color:#f2c94c;}
.usuario-item.tier-40.active .u-meta{color:#3c2d10;}
.usuario-item.tier-40.active .btn-hist{color:#241a10;border-color:#241a10;}

.usuario-item.tier-50{border-color:#9b59f6;}
.usuario-item.tier-50 .u-meta{color:#c6a3ff;font-weight:700;}
.usuario-item.tier-50 .btn-hist{color:#c6a3ff;border-color:#9b59f6;}
.usuario-item.tier-50.active{background:linear-gradient(155deg,#9b59f6,#6b2fc9);color:#fff;border-color:#9b59f6;}
.usuario-item.tier-50.active .u-meta{color:#efe4ff;}
.usuario-item.tier-50.active .btn-hist{color:#fff;border-color:#fff;}
.u-info{flex:1;min-width:0;}
.u-nome{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.u-meta{font-size:12px;color:var(--text-muted);margin-top:2px;}
.usuario-item.active .u-meta{color:#5a4320;}
.btn-hist{flex:0 0 auto;padding:8px 12px;font-size:12.5px;background:transparent;color:var(--gold);border:1px solid var(--gold);}
.usuario-item.active .btn-hist{color:#241a10;border-color:#241a10;}

.empty-hint{color:var(--text-muted);font-size:16px;text-align:center;margin:auto;max-width:280px;line-height:1.5;}

.card-detalhes{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-lg);padding:28px;box-shadow:0 14px 30px rgba(0,0,0,.35);max-width:560px;}
.card-detalhes h3{margin:0 0 18px;font-size:24px;color:var(--gold);border-bottom:1px solid var(--border);padding-bottom:14px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
.info-group{margin-bottom:13px;font-size:15px;line-height:1.55;color:var(--text-muted);}
.info-group b{color:var(--text);font-weight:700;}
.info-highlight{color:var(--gold);font-weight:700;}
.badge{font-size:12px;padding:4px 10px;border-radius:20px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;}
.badge-completo{background:rgba(32,137,95,.18);color:#4fd39a;}
.badge-simples{background:rgba(226,165,62,.18);color:var(--gold);}
.badge-tier10{background:rgba(32,137,95,.18);color:#4fd39a;}
.badge-tier20{background:rgba(224,65,59,.18);color:#f28b86;}
.badge-tier30{background:rgba(59,130,246,.18);color:#8fb8ff;}
.badge-tier40{background:rgba(242,201,76,.2);color:#f2c94c;}
.badge-tier50{background:rgba(155,89,246,.18);color:#c6a3ff;}
.divider-group{margin-top:18px;padding-top:16px;border-top:1px solid var(--border);}
.btn-historico{margin-top:8px;width:100%;background:linear-gradient(155deg,var(--gold),#c98a2a);color:#241a10;padding:13px;border-radius:var(--radius-sm);font-size:14.5px;}
.btn-delete{margin-top:12px;width:100%;background:var(--red);color:#fff;padding:13px;border-radius:var(--radius-sm);font-size:14.5px;}

/* HISTÓRICO (janela) */
.modal{position:fixed;inset:0;background:rgba(8,5,3,.78);z-index:1500;display:flex;align-items:center;justify-content:center;padding:18px;}
.modal-box{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-lg);width:100%;max-width:680px;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,.6);}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;padding:22px 24px 16px;border-bottom:1px solid var(--border);}
.modal-head h3{margin:0;font-size:23px;color:var(--cream);}
.btn-fechar{padding:10px 16px;background:var(--panel-2);color:var(--text);border:1px solid var(--border);font-size:13.5px;}
.modal-corpo{padding:18px 24px 24px;overflow-y:auto;}
.resumo{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px;}
.resumo-item{background:var(--panel-2);border:1px solid var(--border);border-radius:var(--radius-md);padding:12px 14px;}
.resumo-num{font-family:'Fraunces',serif;font-size:24px;font-weight:700;color:var(--gold);line-height:1.1;}
.resumo-txt{font-size:12.5px;color:var(--text-muted);margin-top:3px;}

.hist-pedido{background:var(--panel-2);border:1px solid var(--border);border-radius:var(--radius-md);padding:16px 18px;margin-bottom:12px;}
.hist-pedido.recusado{opacity:.6;}
.hist-topo{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
.hist-topo b{color:var(--cream);font-size:15.5px;}
.hist-data{font-size:13px;color:var(--text-muted);}
.st{font-size:11.5px;padding:3px 10px;border-radius:20px;font-weight:700;}
.st-pendente{background:rgba(226,165,62,.18);color:var(--gold);}
.st-aceito{background:rgba(59,125,216,.2);color:#8db6ef;}
.st-concluido{background:rgba(32,137,95,.18);color:#4fd39a;}
.st-recusado{background:rgba(179,38,30,.2);color:#f19893;}
.hist-qtd{font-size:14px;font-weight:800;color:var(--gold);margin-bottom:6px;}
.hist-pizzas{margin:0 0 10px;padding-left:20px;font-size:14.5px;line-height:1.55;color:var(--text);}
.hist-linha{font-size:13.5px;color:var(--text-muted);line-height:1.5;margin-top:3px;}
.hist-linha b{color:var(--text);}
.hist-total{margin-top:10px;font-family:'Fraunces',serif;font-size:19px;font-weight:700;color:#4fd39a;text-align:right;}

@media (max-width:760px){
  html,body{overflow:auto;height:auto;}
  #cadastro-layout-principal{flex-direction:column;height:auto;min-height:100vh;}
  .sidebar{width:100%;max-width:none;max-height:46vh;border-right:none;border-bottom:1px solid var(--border);}
  .main-content{padding:18px;overflow:visible;}
  .resumo{grid-template-columns:1fr 1fr 1fr;}
  .modal-head,.modal-corpo{padding-left:16px;padding-right:16px;}
}
</style>
</head>
<body>
  <div id="cadastro-login-block" class="login-screen">
    <div class="login-mark">Painel interno</div>
    <h2 class="login-title">Acesso aos cadastros</h2>
    <input type="password" id="cadastro-senha-input" placeholder="Digite a senha de acesso"><br>
    <button class="btn btn-login" onclick="verificarSenhaCadastro()">Entrar</button>
  </div>

  <div id="cadastro-layout-principal" class="hidden">
    <div class="sidebar">
      <div class="sidebar-mark">Padoca disk pizzas</div>
      <h2>Clientes cadastrados</h2>
      <input type="text" id="busca-nome" class="search-box" placeholder="Pesquisar cliente por nome..." oninput="renderizarListaClientes()">
      <div class="lista-usuarios" id="lista-clientes-container"></div>
    </div>

    <div class="main-content">
      <div id="container-detalhes-vazio" class="empty-hint">
        Selecione um cliente na lista ao lado para visualizar os dados completos.
      </div>
      <div id="container-detalhes-ativo" class="card-detalhes hidden"></div>
    </div>
  </div>

  <!-- HISTÓRICO DO CLIENTE -->
  <div id="modal-historico" class="modal hidden" onclick="if (event.target === this) fecharHistorico()">
    <div class="modal-box">
      <div class="modal-head">
        <div>
          <div class="sidebar-mark">Histórico de pedidos</div>
          <h3 id="hist-titulo"></h3>
        </div>
        <button class="btn btn-fechar" onclick="fecharHistorico()">Fechar</button>
      </div>
      <div class="modal-corpo">
        <div id="hist-resumo" class="resumo"></div>
        <div id="hist-lista"></div>
      </div>
    </div>
  </div>

<script>
const INTERVALO_ATUALIZACAO_MS = 1500;   // quão rápido o "último pedido" aparece
let clientes = [];                       // um item por cliente, com todos os pedidos dele
let clienteSelecionadoKey = null;
let historicoAbertoKey = null;
let assinaturaAnterior = '';
let carregando = false;

// ---------- utilidades ----------
function esc(v) {
  return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function chaveCliente(p) {
  return `${String(p.nome || '').trim().toLowerCase()}|${String(p.telefone || '').replace(/\D/g, '')}`;
}
function dinheiro(v) { return `R$ ${(Number(v) || 0).toFixed(2)}`; }
function nomeCompleto(o) { return `${o.nome || ''} ${o.sobrenome || ''}`.trim(); }
function plural(n, um, varios) { return `${n} ${n === 1 ? um : varios}`; }
function dataPedido(p) {
  if (p.criadoEm) {
    const d = new Date(p.criadoEm);
    return `${d.toLocaleDateString('pt-BR')} às ${d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}`;
  }
  return p.dataHora || '';   // pedidos antigos só têm a hora
}
const ROTULO_STATUS = { pendente: 'Pendente', aceito: 'Em preparo', concluido: 'Concluído', recusado: 'Recusado' };

// Níveis de cliente por quantidade de pizzas válidas: 10 verde, 20 vermelho, 30 azul, 40 amarelo, 50 roxo
const NIVEIS = [
  { min: 50, classe: 'tier-50', label: '50+', nome: 'Roxo' },
  { min: 40, classe: 'tier-40', label: '40+', nome: 'Amarelo' },
  { min: 30, classe: 'tier-30', label: '30+', nome: 'Azul' },
  { min: 20, classe: 'tier-20', label: '20+', nome: 'Vermelho' },
  { min: 10, classe: 'tier-10', label: '10+', nome: 'Verde' }
];
function obterNivel(totalPizzas) {
  return NIVEIS.find(n => totalPizzas >= n.min) || null;
}

// Lista de pizzas de um pedido (cada item do carrinho = 1 pizza; meio a meio conta como 1)
function extrairPizzas(p) {
  if (Array.isArray(p.itens) && p.itens.length) {
    return p.itens.map(i => {
      const s = i.sabores || [];
      return i.tipo === 'metade'
        ? `Meio a meio: 1/2 ${s[0] || ''} e 1/2 ${s[1] || ''}`
        : `Inteira: ${s[0] || ''}`;
    });
  }
  // Pedidos antigos (sem itens estruturados): lê o texto "detalhe"
  return String(p.detalhe || '').split(' + ')
    .map(t => t.trim().replace(/^\[/, '').replace(/\]\s*\([^)]*\)\s*$/, ''))
    .filter(Boolean);
}

// ---------- login ----------
if (sessionStorage.getItem('padoca_cadastro_auth') === 'true') { liberarSiteCadastro(); }
document.getElementById('cadastro-senha-input').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenhaCadastro(); });

async function verificarSenhaCadastro() {
  const senhaDigitada = document.getElementById('cadastro-senha-input').value.trim();
  try {
    const res = await fetch(`${window.location.origin}/api/cadastro/verificar-senha`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ senha: senhaDigitada })
    });
    if (res.ok) {
      sessionStorage.setItem('padoca_cadastro_auth', 'true');
      liberarSiteCadastro();
    } else { alert("Senha de acesso inválida!"); }
  } catch (e) { alert("Erro ao validar credenciais com o servidor."); }
}

function liberarSiteCadastro() {
  document.getElementById('cadastro-login-block').classList.add('hidden');
  document.getElementById('cadastro-layout-principal').classList.remove('hidden');
  carregarDadosClientes();
  setInterval(carregarDadosClientes, INTERVALO_ATUALIZACAO_MS);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) carregarDadosClientes(); });
}

// ---------- dados ----------
async function carregarDadosClientes() {
  if (carregando) return;
  carregando = true;
  try {
    const res = await fetch(`${window.location.origin}/api/pedidos`, { cache: 'no-store' });
    const pedidos = await res.json();

    // Só redesenha se algo mudou (evita piscar a tela a cada 1,5s)
    const assinatura = JSON.stringify(pedidos);
    if (assinatura === assinaturaAnterior) return;
    assinaturaAnterior = assinatura;

    const mapa = new Map();
    pedidos.forEach(p => {
      const key = chaveCliente(p);
      if (!mapa.has(key)) mapa.set(key, { key, pedidos: [] });
      mapa.get(key).pedidos.push(p);
    });

    clientes = [...mapa.values()].map(c => {
      c.pedidos.sort((a, b) => a.id - b.id);

      // Recusados não contam como pedido, pizza, gasto nem "último pedido" — só ficam no histórico
      c.validos = c.pedidos.filter(p => p.status !== 'recusado');
      c.ultimo = c.validos[c.validos.length - 1] || null;
      c.ultimoBruto = c.pedidos[c.pedidos.length - 1];   // fallback só p/ nome/telefone/endereço quando tudo foi recusado

      c.totalPizzas = c.validos.reduce((soma, p) => soma + extrairPizzas(p).length, 0);
      c.totalGasto = c.validos.reduce((soma, p) => soma + (Number(p.total) || 0), 0);
      c.tier = obterNivel(c.totalPizzas);
      return c;
    }).sort((a, b) => {
      // Prioridade: quem tem nível (10+ pizzas) aparece em cima, do nível mais alto pro mais baixo
      const nivelA = a.tier ? a.tier.min : 0;
      const nivelB = b.tier ? b.tier.min : 0;
      if (nivelA !== nivelB) return nivelB - nivelA;
      if (a.totalPizzas !== b.totalPizzas) return b.totalPizzas - a.totalPizzas;
      return c_maiorId(b) - c_maiorId(a);   // no empate, quem pediu por último fica em cima
    });

    function c_maiorId(c) { return c.pedidos.reduce((m, p) => Math.max(m, p.id), 0); }

    renderizarListaClientes();
    atualizarFichaExibicao();
    if (historicoAbertoKey) renderizarHistorico();
  } catch (e) { console.log("Erro de atualização."); }
  finally { carregando = false; }
}

// ---------- lista ----------
function renderizarListaClientes() {
  const container = document.getElementById('lista-clientes-container');
  const termo = document.getElementById('busca-nome').value.toLowerCase().trim();
  const filtrados = clientes.filter(c => nomeCompleto(c.ultimo || c.ultimoBruto).toLowerCase().includes(termo));

  if (filtrados.length === 0) {
    container.innerHTML = "<p class='empty-list'>Nenhum registro encontrado.</p>";
    return;
  }
  container.innerHTML = filtrados.map(c => `
    <div class="usuario-item ${clienteSelecionadoKey === c.key ? 'active' : ''} ${c.tier ? c.tier.classe : ''}" data-key="${esc(c.key)}">
      <div class="u-info">
        <div class="u-nome">${esc(nomeCompleto(c.ultimo || c.ultimoBruto))}</div>
        <div class="u-meta">${plural(c.validos.length, 'pedido', 'pedidos')} &middot; ${plural(c.totalPizzas, 'pizza', 'pizzas')}${c.tier ? ' &middot; ' + c.tier.label : ''}</div>
      </div>
      <button class="btn btn-hist" data-hist="${esc(c.key)}">Histórico</button>
    </div>`).join('');
}

document.getElementById('lista-clientes-container').addEventListener('click', e => {
  const btnHist = e.target.closest('[data-hist]');
  if (btnHist) { selecionarClienteFicha(btnHist.dataset.hist); abrirHistorico(btnHist.dataset.hist); return; }
  const item = e.target.closest('.usuario-item');
  if (item) selecionarClienteFicha(item.dataset.key);
});

function selecionarClienteFicha(key) {
  clienteSelecionadoKey = key;
  renderizarListaClientes();
  atualizarFichaExibicao();
}

// ---------- ficha ----------
function atualizarFichaExibicao() {
  const containerVazio = document.getElementById('container-detalhes-vazio');
  const containerAtivo = document.getElementById('container-detalhes-ativo');
  const cliente = clientes.find(c => c.key === clienteSelecionadoKey);

  if (!cliente) {
    containerVazio.classList.remove('hidden');
    containerAtivo.classList.add('hidden');
    clienteSelecionadoKey = null;
    return;
  }
  containerVazio.classList.add('hidden');
  containerAtivo.classList.remove('hidden');

  const u = cliente.ultimo || cliente.ultimoBruto;   // detalhes do pedido válido mais recente (ou só contato, se tudo foi recusado)
  const tagClasse = u.tipoCadastro === 'completo' ? 'badge-completo' : 'badge-simples';
  const tagTexto = u.tipoCadastro === 'completo' ? 'Fidelidade' : 'Simples';

  const blocoUltimoPedido = cliente.ultimo ? `
    <div class="info-group divider-group">
      <b>Último pedido (#${cliente.ultimo.id}) &middot; ${esc(dataPedido(cliente.ultimo))} &middot; ${esc(ROTULO_STATUS[cliente.ultimo.status] || cliente.ultimo.status)}</b><br>
      <span class="info-highlight">${esc(cliente.ultimo.detalhe)}</span>
    </div>
    <div class="info-group"><b>Borda:</b> ${esc(cliente.ultimo.borda) || 'Sem borda'}</div>
    <div class="info-group"><b>Extras:</b> ${esc(cliente.ultimo.extras) || 'Nenhum'}</div>
    <div class="info-group"><b>Pagamento:</b> ${esc(cliente.ultimo.pagamento)}</div>
    <div class="info-group"><b>Observações registradas:</b> ${esc(cliente.ultimo.observacoes) || 'Nenhuma'}</div>
  ` : `
    <div class="info-group divider-group">Este cliente ainda não tem nenhum pedido válido (todos os pedidos foram recusados).</div>
  `;

  containerAtivo.innerHTML = `
    <h3>Ficha do cliente <span class="badge ${tagClasse}">${tagTexto}</span> ${cliente.tier ? `<span class="badge badge-${cliente.tier.classe.replace('tier-', 'tier')}">${cliente.tier.label} pizzas &middot; ${cliente.tier.nome}</span>` : ''}</h3>
    <div class="info-group"><b>Nome cadastrado:</b> ${esc(u.nome)}</div>
    <div class="info-group"><b>Sobrenome:</b> ${esc(u.sobrenome) || 'Não preenchido'}</div>
    <div class="info-group"><b>WhatsApp / celular:</b> ${esc(u.telefone)}</div>
    <div class="info-group"><b>Endereço de entrega:</b> ${esc(u.endereco)}</div>
    <div class="info-group"><b>Total de pedidos:</b> ${cliente.validos.length}</div>
    <div class="info-group"><b>Total de pizzas:</b> ${cliente.totalPizzas}</div>
    <div class="info-group"><b>Total gasto:</b> <span class="info-highlight">${dinheiro(cliente.totalGasto)}</span></div>
    ${blocoUltimoPedido}
    <button class="btn btn-historico" onclick="abrirHistorico(clienteSelecionadoKey)">Ver histórico de pedidos</button>
    <button class="btn btn-delete" onclick="excluirCadastroCliente()">Excluir cadastro completamente</button>
  `;
}

// ---------- histórico ----------
function abrirHistorico(key) {
  historicoAbertoKey = key;
  document.getElementById('modal-historico').classList.remove('hidden');
  renderizarHistorico();
}

function fecharHistorico() {
  historicoAbertoKey = null;
  document.getElementById('modal-historico').classList.add('hidden');
}

document.addEventListener('keydown', e => { if (e.key === 'Escape' && historicoAbertoKey) fecharHistorico(); });

function renderizarHistorico() {
  const cliente = clientes.find(c => c.key === historicoAbertoKey);
  if (!cliente) { fecharHistorico(); return; }

  document.getElementById('hist-titulo').innerText = nomeCompleto(cliente.ultimo || cliente.ultimoBruto);

  // Resumo ignora pedidos recusados (não foram entregues nem cobrados) — mesmos totais já calculados para a lista/ficha
  document.getElementById('hist-resumo').innerHTML = `
    <div class="resumo-item"><div class="resumo-num">${cliente.validos.length}</div><div class="resumo-txt">${plural(cliente.validos.length, 'pedido', 'pedidos')}</div></div>
    <div class="resumo-item"><div class="resumo-num">${cliente.totalPizzas}</div><div class="resumo-txt">${plural(cliente.totalPizzas, 'pizza', 'pizzas')} no total</div></div>
    <div class="resumo-item"><div class="resumo-num">${dinheiro(cliente.totalGasto)}</div><div class="resumo-txt">gasto no total</div></div>`;

  document.getElementById('hist-lista').innerHTML = [...cliente.pedidos].reverse().map(p => {
    const pizzas = extrairPizzas(p);
    const temExtras = p.extras && p.extras !== 'Nenhum';
    return `
    <div class="hist-pedido ${p.status === 'recusado' ? 'recusado' : ''}">
      <div class="hist-topo">
        <b>Pedido #${p.id}</b>
        <span class="hist-data">${esc(dataPedido(p))}</span>
        <span class="st st-${esc(p.status)}">${esc(ROTULO_STATUS[p.status] || p.status)}</span>
      </div>
      <div class="hist-qtd">${plural(pizzas.length, 'pizza', 'pizzas')}</div>
      <ul class="hist-pizzas">${pizzas.map(t => `<li>${esc(t)}</li>`).join('')}</ul>
      <div class="hist-linha"><b>Borda:</b> ${esc(p.borda) || 'Sem borda'}</div>
      ${temExtras ? `<div class="hist-linha"><b>Extras:</b> ${esc(p.extras)}</div>` : ''}
      <div class="hist-linha"><b>Pagamento:</b> ${esc(p.pagamento)}</div>
      <div class="hist-total">${dinheiro(p.total)}</div>
    </div>`;
  }).join('');
}

// ---------- exclusão ----------
async function excluirCadastroCliente() {
  const cliente = clientes.find(c => c.key === clienteSelecionadoKey);
  if (!cliente) return;
  const n = cliente.pedidos.length;
  if (!confirm(`Tem certeza que deseja apagar permanentemente este cadastro e ${plural(n, 'pedido', 'pedidos')} do histórico?`)) return;
  try {
    const res = await fetch(`${window.location.origin}/api/cadastro/excluir`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ nome: (cliente.ultimo || cliente.ultimoBruto).nome, telefone: (cliente.ultimo || cliente.ultimoBruto).telefone })
    });
    if (res.ok) {
      alert("Cadastro removido com sucesso!");
      clienteSelecionadoKey = null;
      assinaturaAnterior = '';
      carregarDadosClientes();
    }
  } catch (e) { alert("Erro ao excluir o cadastro."); }
}
</script>
