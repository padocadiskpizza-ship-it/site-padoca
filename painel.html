<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel da Cozinha - Padoca</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#e8531f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;0,9..144,900;1,9..144,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f0a07; --bg-grad:radial-gradient(1200px 600px at 50% -10%, #2a1a12 0%, #0f0a07 60%);
  --panel:#1c1510; --panel-2:#261c15; --panel-glass:rgba(30,22,17,.72);
  --border:#3a2b20; --border-soft:#2d2119;
  --cream:#f8ecd8; --text:#f3e9db; --text-muted:#a89a89;
  --tomato:#e8531f; --tomato-dark:#b83a12; --gold:#f0b429; --gold-dark:#c98a1f;
  --green:#2ecc71; --green-dark:#22a05a; --red:#e0413b; --blue:#3b82f6;
  --shadow:0 20px 50px rgba(0,0,0,.55); --shadow-sm:0 8px 18px rgba(0,0,0,.35);
  --radius-xl:26px; --radius-lg:20px; --radius-md:14px; --radius-sm:10px;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Manrope',sans-serif;-webkit-font-smoothing:antialiased;}
body{background:var(--bg-grad);background-attachment:fixed;padding:26px 22px 60px;}
h1,h2,h3,.display{font-family:'Fraunces',serif;}
.hidden{display:none !important;}
a{color:var(--gold);}

@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}
.fade-up{animation:fadeUp .45s var(--ease) both;}

/* LOGIN */
.login-screen{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:2000;padding:24px;background:var(--bg-grad);}
.login-card{background:linear-gradient(180deg,var(--panel),#16100b);border:1px solid var(--border);border-radius:var(--radius-lg);padding:40px 32px;box-shadow:var(--shadow);max-width:380px;width:100%;text-align:center;animation:fadeUp .4s var(--ease);}
.login-mark{font-size:12px;letter-spacing:.18em;color:var(--gold);font-weight:800;text-transform:uppercase;margin-bottom:8px;}
.login-title{font-size:26px;font-weight:700;color:var(--cream);margin:0 0 22px;}
input[type="password"],input[type="text"]{
  padding:14px 16px;font-size:16px;border-radius:var(--radius-sm);border:1px solid var(--border);
  background:#120d0a;color:var(--text);box-sizing:border-box;outline:none;width:100%;margin-bottom:14px;transition:border-color .18s,box-shadow .18s;
}
input[type="password"]:focus,input[type="text"]:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(240,180,41,.15);}
.btn{border:none;border-radius:var(--radius-sm);font-family:inherit;font-weight:700;cursor:pointer;transition:transform .08s,filter .15s;}
.btn:active{transform:scale(.97);}
.btn-login{padding:14px 34px;background:linear-gradient(155deg,var(--gold),var(--gold-dark));color:#241a10;font-size:15.5px;width:100%;margin-top:6px;box-shadow:0 8px 20px rgba(240,180,41,.3);}
.btn-login:hover{filter:brightness(1.08);}

/* HEADER */
.top-header{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:16px;margin-bottom:26px;}
.brand-mark{font-size:12px;letter-spacing:.18em;color:var(--gold);font-weight:800;text-transform:uppercase;margin-bottom:6px;}
.page-title{font-size:32px;font-weight:700;color:var(--cream);margin:0;line-height:1.1;}
.page-sub{font-size:14px;color:var(--text-muted);margin-top:4px;}

.controls-row{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:28px;}
.control-card{background:linear-gradient(180deg,var(--panel),#16100b);border:1px solid var(--border);border-radius:var(--radius-md);padding:16px 18px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow-sm);}
.control-label{font-size:11.5px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;}
.status-pill{padding:10px 20px;border-radius:30px;font-weight:700;font-size:13.5px;border:none;cursor:pointer;transition:all .18s;}
.status-pill.online{background:linear-gradient(155deg,var(--green),var(--green-dark));color:#fff;box-shadow:0 6px 16px rgba(46,204,113,.3);}
.status-pill.offline{background:linear-gradient(155deg,var(--red),#a92323);color:#fff;box-shadow:0 6px 16px rgba(224,65,59,.3);}
.promo-card{flex:1;min-width:280px;gap:10px;}
.promo-card input{flex:1;padding:10px 14px;font-size:14px;border-radius:var(--radius-sm);border:1px solid var(--border);background:#120d0a;color:var(--text);outline:none;transition:border-color .18s;}
.promo-card input:focus{border-color:var(--gold);}
.btn-save{padding:10px 18px;background:linear-gradient(155deg,var(--gold),var(--gold-dark));color:#241a10;font-size:13px;white-space:nowrap;border-radius:var(--radius-sm);font-weight:700;}
.btn-save:hover{filter:brightness(1.08);}

/* DISPONIBILIDADE */
.secao-disponibilidade{background:linear-gradient(180deg,var(--panel),#16100b);border:1px solid var(--border);border-radius:var(--radius-md);padding:18px 20px;margin-bottom:28px;box-shadow:var(--shadow-sm);}
.secao-disponibilidade .control-label{display:block;margin-bottom:12px;}
.grade-disponibilidade{display:flex;flex-wrap:wrap;gap:9px;}
.chip-sabor{background:var(--panel-2);border:1px solid var(--border);padding:9px 15px;border-radius:30px;font-size:13px;font-weight:700;color:var(--text);cursor:pointer;transition:all .15s;}
.chip-sabor:hover{border-color:var(--gold);transform:translateY(-2px);}
.chip-sabor.indisponivel{background:rgba(224,65,59,.15);border-color:var(--red);color:#f19893;text-decoration:line-through;}

/* GRID PEDIDOS */
.grid-pedidos{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:18px;}
.empty-state{color:var(--text-muted);font-size:15px;grid-column:1/-1;padding:40px 0;text-align:center;}
.pedido-card{background:linear-gradient(180deg,var(--panel),#16100b);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;justify-content:space-between;transition:transform .18s,box-shadow .18s;animation:fadeUp .35s var(--ease);}
.pedido-card:hover{transform:translateY(-3px);box-shadow:var(--shadow);}
.pedido-card.novo{animation:pulse .6s ease 2;}
.pedido-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);padding-bottom:10px;margin-bottom:12px;}
.pedido-head h3{margin:0;font-size:20px;color:var(--gold);font-family:'Fraunces',serif;}
.badge{font-size:10.5px;padding:4px 10px;border-radius:20px;font-weight:700;white-space:nowrap;text-transform:uppercase;letter-spacing:.03em;}
.badge-alta{background:rgba(46,204,113,.18);color:#4fd39a;}
.badge-media{background:rgba(240,180,41,.18);color:var(--gold);}
.badge-baixa{background:rgba(224,65,59,.18);color:#f19893;}
.badge-completo{background:rgba(240,180,41,.18);color:var(--gold);}
.badge-simples{background:rgba(255,255,255,.06);color:var(--text-muted);}

.info-line{margin:7px 0;font-size:14px;color:var(--text-muted);line-height:1.45;}
.info-line b{color:var(--text);font-weight:700;}
.info-highlight{color:var(--gold);font-weight:700;}
.status-line{text-transform:uppercase;font-weight:800;font-size:12px;letter-spacing:.06em;color:var(--gold);margin-top:6px;}
.total-line{color:var(--green);font-size:24px;font-weight:800;font-family:'Fraunces',serif;margin:16px 0 0;}

.btn-actions{display:flex;flex-direction:column;gap:8px;margin-top:14px;}
.btn-row{display:flex;gap:8px;}
.btn-print{background:linear-gradient(155deg,var(--blue),#1d4ed8);color:#fff;padding:12px;font-size:13px;flex:1;border-radius:var(--radius-sm);}
.btn-accept{background:linear-gradient(155deg,var(--green),var(--green-dark));color:#fff;padding:12px;font-size:13px;flex:1;border-radius:var(--radius-sm);box-shadow:0 6px 14px rgba(46,204,113,.25);}
.btn-refuse{background:linear-gradient(155deg,var(--red),#a92323);color:#fff;padding:12px;font-size:13px;flex:1;border-radius:var(--radius-sm);}
.btn-dispatch{background:linear-gradient(155deg,var(--green-dark),#0f5a3d);color:#fff;padding:12px;font-size:13px;border-radius:var(--radius-sm);width:100%;}
.btn-remove{background:#4b4038;color:#fff;padding:12px;font-size:13px;border-radius:var(--radius-sm);width:100%;}
.refused-note{color:#f19893;font-weight:700;text-align:center;font-size:13px;margin:6px 0;}

/* PRINT */
@media print {
  body{background:#fff;color:#000;padding:0;margin:0;}
  #login-block,#painel-conteudo{display:none !important;}
  #cupom-impressao{display:block !important;width:80mm;font-family:'Manrope',sans-serif;font-size:26px !important;font-weight:900 !important;color:#000;line-height:1.3;word-wrap:break-word;}
  #cupom-impressao p,#cupom-impressao div{font-size:26px !important;font-weight:900 !important;color:#000 !important;}
}

/* TOAST */
.toast{position:fixed;top:18px;right:18px;background:var(--panel);border:1px solid var(--border);color:var(--text);padding:12px 18px;border-radius:12px;box-shadow:var(--shadow);z-index:9999;opacity:0;pointer-events:none;transition:all .3s var(--ease);font-size:13.5px;font-weight:600;max-width:90vw;}
.toast.show{opacity:1;pointer-events:auto;}
.toast.ok{border-color:var(--green);color:#4fd39a;}
.toast.err{border-color:var(--red);color:#f19893;}

@media (max-width:760px){
  body{padding:18px 14px 40px;}
  .page-title{font-size:26px;}
}
</style>
</head>
<body>

<div id="login-block" class="login-screen">
  <div class="login-card">
    <div class="login-mark">Painel interno</div>
    <h2 class="login-title">Acesso da cozinha</h2>
    <input type="password" id="senha" placeholder="Digite a senha" onkeydown="if(event.key==='Enter')verificarSenha()">
    <button class="btn btn-login" onclick="verificarSenha()">Acessar painel</button>
    <p style="color:var(--text-muted);font-size:12px;margin-top:14px;">Área restrita à equipe Padoca</p>
  </div>
</div>

<div id="painel-conteudo" class="hidden">
  <div class="top-header fade-up">
    <div>
      <div class="brand-mark">Padoca disk pizzas</div>
      <h1 class="page-title">Pedidos em tempo real</h1>
      <p class="page-sub">Gerencie a fila, disponibilidade e promoções</p>
    </div>
  </div>

  <div class="controls-row fade-up">
    <div class="control-card">
      <span class="control-label">Loja virtual</span>
      <button id="btn-toggle-status" class="status-pill online" onclick="alternarStatusSite()">Online (aberto)</button>
    </div>
    <div class="control-card promo-card">
      <span class="control-label">Promoção do dia</span>
      <input type="text" id="input-promo-texto" placeholder="Carregando promoção...">
      <button class="btn btn-save" onclick="salvarPromocao()">Salvar</button>
    </div>
  </div>

  <div class="secao-disponibilidade fade-up">
    <span class="control-label">Disponibilidade das pizzas · clique para marcar/desmarcar como indisponível</span>
    <div class="grade-disponibilidade" id="grade-disponibilidade"></div>
  </div>

  <div class="grid-pedidos" id="lista-pedidos"></div>
</div>

<div id="cupom-impressao" class="hidden"></div>
<div id="toast" class="toast"></div>

<script src="/config.js"></script>
<script>
let statusSite = true;
let ultimoIdVisto = null;
let audioCtx = null;

function iniciarAudioPersistente() {
  if (audioCtx) { if (audioCtx.state === 'suspended') audioCtx.resume().catch(()=>{}); return; }
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    gain.gain.value = 0.0001;
    osc.frequency.value = 20;
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start();
  } catch (e) { }
}
document.addEventListener('click', iniciarAudioPersistente, { once: true });
document.addEventListener('keydown', iniciarAudioPersistente, { once: true });
document.addEventListener('visibilitychange', () => { if (!document.hidden) iniciarAudioPersistente(); });

function tocarSomNotificacao() {
  iniciarAudioPersistente();
  if (!audioCtx) return;
  if (audioCtx.state === 'suspended') audioCtx.resume().catch(()=>{});
  const bipar = (delay) => setTimeout(() => {
    for (let i = 0; i < 2; i++) {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(950, audioCtx.currentTime);
      gain.gain.setValueAtTime(2.0, audioCtx.currentTime);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + 0.30);
    }
  }, delay);
  bipar(0); bipar(250);
}

function base64ParaUint8Array(base64) {
  const padding = '='.repeat((4 - (base64.length % 4)) % 4);
  const base64Seguro = (base64 + padding).replace(/-/g, '+').replace(/_/g, '/');
  const bruto = atob(base64Seguro);
  return Uint8Array.from([...bruto].map(c => c.charCodeAt(0)));
}

async function ativarNotificacaoDoSistema() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) return;
  try {
    if (Notification.permission === 'default') await Notification.requestPermission();
    if (Notification.permission !== 'granted') return;
    const registro = await navigator.serviceWorker.register('/sw.js');
    await navigator.serviceWorker.ready;
    const inscricaoExistente = await registro.pushManager.getSubscription();
    if (inscricaoExistente) return;
    const resChave = await fetch(`${window.PADOCA_API('')}/api/push/chave-publica`);
    if (!resChave.ok) return;
    const { chave } = await resChave.json();
    const inscricao = await registro.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: base64ParaUint8Array(chave) });
    await fetch(`${window.PADOCA_API('')}/api/push/inscrever`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(inscricao) });
  } catch (e) { }
}

document.addEventListener('input', function (e) {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
    const limpo = e.target.value.replace(/[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{1F1E0}-\u{1F1FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}\u{1F900}-\u{1F9FF}\u{1FA00}-\u{1FA6F}\u{1FA70}-\u{1FAFF}]/gu, '');
    if (e.target.value !== limpo) e.target.value = limpo;
  }
});

if (localStorage.getItem('padoca_auth') === 'true') { liberarPainel(); }

function verificarSenha() {
  if (document.getElementById('senha').value === "Padoca") {
    localStorage.setItem('padoca_auth', 'true');
    liberarPainel();
  } else { toast('Senha incorreta.','err'); }
}

function toast(msg, tipo='ok', ms=2600){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + (tipo==='err'?'err':'ok');
  clearTimeout(t._t);
  t._t = setTimeout(()=> t.classList.remove('show'), ms);
}

async function liberarPainel() {
  document.getElementById('login-block').classList.add('hidden');
  document.getElementById('painel-conteudo').classList.remove('hidden');
  iniciarAudioPersistente();
  ativarNotificacaoDoSistema();
  carregarDisponibilidade();
  try {
    const res = await fetch(`${window.PADOCA_API('')}/api/status`);
    const data = await res.json();
    statusSite = data.online;
    atualizarBotaoStatus();
  } catch (e) { }
  try {
    const resPromo = await fetch(`${window.PADOCA_API('')}/api/promocao`);
    const dataPromo = await resPromo.json();
    document.getElementById('input-promo-texto').value = dataPromo.texto;
  } catch (e) { }
  atualizarPedidos();
  setInterval(atualizarPedidos, 3000);
}

let cardapioCompleto = [];
let indisponiveisIds = [];

async function carregarDisponibilidade() {
  try {
    const resCardapio = await fetch(`${window.PADOCA_API('')}/api/cardapio`);
    cardapioCompleto = await resCardapio.json();
  } catch (e) {
    document.getElementById('grade-disponibilidade').innerHTML = "<span style='color:var(--text-muted);font-size:13.5px;'>Não foi possível carregar as pizzas.</span>";
    return;
  }
  try {
    const resIndisp = await fetch(`${window.PADOCA_API('')}/api/indisponiveis`);
    if (!resIndisp.ok) throw new Error('rota');
    indisponiveisIds = await resIndisp.json();
  } catch (e) { indisponiveisIds = []; }
  renderizarGradeDisponibilidade();
}

function renderizarGradeDisponibilidade() {
  const container = document.getElementById('grade-disponibilidade');
  container.innerHTML = cardapioCompleto.map(p => `
    <button type="button" class="chip-sabor ${indisponiveisIds.includes(p.id) ? 'indisponivel' : ''}" onclick="alternarDisponibilidade(${p.id})">${p.nome}</button>
  `).join('');
}

async function alternarDisponibilidade(id) {
  try {
    const res = await fetch(`${window.PADOCA_API('')}/api/indisponiveis/alternar`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id })
    });
    if (!res.ok) throw new Error('rota');
    const data = await res.json();
    if (data.success) {
      indisponiveisIds = data.indisponiveis;
      renderizarGradeDisponibilidade();
      toast('Disponibilidade atualizada');
    }
  } catch (e) { toast('Não foi possível alterar. Reinicie o server.js.','err'); }
}

async function alternarStatusSite() {
  statusSite = !statusSite;
  await fetch(`${window.PADOCA_API('')}/api/status`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ online: statusSite })
  });
  atualizarBotaoStatus();
  toast(statusSite ? 'Loja aberta' : 'Loja fechada');
}

function atualizarBotaoStatus() {
  const btn = document.getElementById('btn-toggle-status');
  if (statusSite) { btn.innerText = "Online (aberto)"; btn.className = "status-pill online"; }
  else { btn.innerText = "Fechado (site oculto)"; btn.className = "status-pill offline"; }
}

async function salvarPromocao() {
  const texto = document.getElementById('input-promo-texto').value.trim();
  await fetch(`${window.PADOCA_API('')}/api/promocao`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ texto })
  });
  toast('Promoção atualizada');
}

async function mudarStatusPedido(id, status, motivoRecusa = '') {
  await fetch(`${window.PADOCA_API('')}/api/pedidos/status`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id, status, motivoRecusa })
  });
  atualizarPedidos();
}

async function darBaixa(id) {
  await fetch(`${window.PADOCA_API('')}/api/pedidos/concluir`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id })
  });
  atualizarPedidos();
  toast('Pedido concluído');
}

function classeSegurancaDe(txt) {
  if (!txt) return 'badge-media';
  if (txt.startsWith('Alta')) return 'badge-alta';
  if (txt.startsWith('Baixa')) return 'badge-baixa';
  return 'badge-media';
}

async function atualizarPedidos() {
  const res = await fetch(`${window.PADOCA_API('')}/api/pedidos`);
  const pedidos = await res.json();

  const maiorId = pedidos.reduce((m, p) => Math.max(m, p.id), 0);
  if (ultimoIdVisto !== null && maiorId > ultimoIdVisto) {
    const novoPedido = pedidos.find(p => p.id === maiorId);
    tocarSomNotificacao();
    const dadosTextoStr = encodeURIComponent(JSON.stringify(novoPedido));
    setTimeout(() => { imprimirCupomDuplo(dadosTextoStr); }, 500);
    toast('Novo pedido recebido! #' + maiorId, 'ok', 4000);
  }
  ultimoIdVisto = maiorId;

  const fila = pedidos.filter(p => p.status !== 'concluido');

  const container = document.getElementById('lista-pedidos');
  if (fila.length === 0) {
    container.innerHTML = "<p class='empty-state'>Aguardando novos pedidos na fila...</p>";
    return;
  }

  container.innerHTML = fila.map(p => {
    const dadosTexto = encodeURIComponent(JSON.stringify(p));
    let botoesControle = '';
    if (p.status === 'pendente') {
      botoesControle = `
        <div class="btn-row">
          <button class="btn btn-accept" onclick="mudarStatusPedido(${p.id}, 'aceito')">Aceitar</button>
          <button class="btn btn-refuse" onclick="solicitarRecusa(${p.id})">Recusar</button>
        </div>`;
    } else if (p.status === 'aceito') {
      botoesControle = `<button class="btn btn-dispatch" onclick="darBaixa(${p.id})">Despachar (concluir)</button>`;
    } else if (p.status === 'recusado') {
      botoesControle = `<div class="refused-note">Pedido recusado</div>
                        <button class="btn btn-remove" onclick="darBaixa(${p.id})">Remover da fila</button>`;
    }

    return `
    <div class="pedido-card">
      <div>
        <div class="pedido-head">
          <h3>Pedido #${p.id}</h3>
          <span class="badge ${classeSegurancaDe(p.seguranca)}">${p.seguranca || 'Média'}</span>
        </div>
        <p class="info-line"><b>Cadastro:</b> <span class="badge ${p.tipoCadastro === 'completo' ? 'badge-completo' : 'badge-simples'}">${p.tipoCadastro === 'completo' ? 'Fidelidade' : 'Simples'}</span></p>
        <p class="info-line"><b>Cliente:</b> ${p.nome} ${p.sobrenome || ''}</p>
        <p class="info-line"><b>Contato:</b> ${p.telefone}</p>
        <p class="info-line"><b>Destino:</b> ${p.endereco}</p>
        <p class="info-line"><b>Itens:</b> <span class="info-highlight">${p.detalhe}</span></p>
        <p class="info-line"><b>Borda:</b> ${p.borda || 'Sem borda'}</p>
        <p class="info-line"><b>Extras:</b> ${p.extras || 'Nenhum'}</p>
        <p class="info-line"><b>Obs:</b> ${p.observacoes || 'Nenhuma'}</p>
        <p class="info-line"><b>Pagamento:</b> ${p.pagamento}</p>
        <p class="info-line status-line">${p.status}</p>
      </div>
      <div>
        <p class="total-line">Total: R$ ${p.total.toFixed(2)}</p>
        <div class="btn-actions">
          <button class="btn btn-print" onclick="imprimirCupom('${dadosTexto}')">Reimprimir cupom</button>
          ${botoesControle}
        </div>
      </div>
    </div>`;
  }).join('');
}

function solicitarRecusa(id) {
  const motivo = prompt("Digite o motivo pelo qual o pedido está sendo recusado:");
  if (motivo === null || motivo.trim() === "") return;
  mudarStatusPedido(id, 'recusado', motivo.trim());
}

function montarCupomHTML(p) {
  return `
    <div>
      <div style="text-align:center;font-weight:bold;">=== PADOCA DISK PIZZAS ===</div>
      <div style="text-align:center;font-weight:bold;">VIA IMPRESSA DE CONTROLE</div>
      <br>
      <div><b>PEDIDO #${p.id}</b></div>
      <div>Hora: ${p.dataHora || ''}</div>
      <div>--------------------------------</div>
      <div><b>Cliente:</b> ${p.nome} ${p.sobrenome || ''}</div>
      <div><b>Tel:</b> ${p.telefone}</div>
      <div><b>End:</b> ${p.endereco}</div>
      <div>--------------------------------</div>
      <div><b>Itens:</b><br><span style="font-weight:bold;">${p.detalhe}</span></div>
      <div><b>Borda:</b> ${p.borda || 'Sem borda'}</div>
      <div><b>Extras:</b> ${p.extras || 'Nenhum'}</div>
      <div>--------------------------------</div>
      <div><b>Obs:</b> ${p.observacoes || 'Nenhuma'}</div>
      <div>--------------------------------</div>
      <div><b>Pagamento:</b> ${p.pagamento}</div>
      <div style="font-weight:bold;font-size:30px !important;">TOTAL: R$ ${p.total.toFixed(2)}</div>
      <div style="text-align:center;">==============================</div>
    </div>
  `;
}

function imprimirCupom(dadosUrl) {
  const p = JSON.parse(decodeURIComponent(dadosUrl));
  document.getElementById('cupom-impressao').innerHTML = montarCupomHTML(p);
  window.print();
}

function imprimirCupomDuplo(dadosUrl) {
  const p = JSON.parse(decodeURIComponent(dadosUrl));
  document.getElementById('cupom-impressao').innerHTML = montarCupomHTML(p);
  window.print();
  setTimeout(() => { window.print(); }, 1000);
}
</script>
</body>
